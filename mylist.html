<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyList</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121110;
    --bg-soft: #1a1917;
    --bg-elevated: #201f1c;
    --border: #2d2b27;
    --border-soft: #26241f;
    --text: #f2ede4;
    --text-dim: #a89f92;
    --text-faint: #6f675c;
    --orange: #ff7a1a;
    --orange-dim: #d9660f;
    --orange-glow: rgba(255,122,26,.35);
    --green: #3ecf6e;
    --yellow: #f0c419;
    --red: #e8433d;
    --blue: #9bd6ef;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow: 0 12px 32px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #1c1a17 0%, var(--bg) 55%) fixed;
    color: var(--text);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background: var(--orange-glow); color:#fff; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }
  a{ color:inherit; }

  /* ---------- Topbar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:64px;
    display:flex; align-items:center; padding:0 20px;
    z-index:40; pointer-events:none;
  }
  .menu-btn{
    pointer-events:auto;
    width:44px; height:44px; border-radius:12px;
    background: var(--bg-elevated);
    border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    transition: background .2s, transform .2s;
  }
  .menu-btn:hover{ background:#2a2824; transform: translateY(-1px); }
  .menu-btn span{ width:20px; height:2.5px; background:var(--orange); border-radius:2px; transition:.25s; }
  .menu-btn.active span:nth-child(1){ transform: translateY(3.75px) rotate(45deg); }
  .menu-btn.active span:nth-child(2){ transform: translateY(-3.75px) rotate(-45deg); }

  /* ---------- Sidebar ---------- */
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; width:320px; max-width:86vw;
    background: var(--bg-soft);
    border-right:1px solid var(--border);
    z-index:50;
    transform: translateX(-100%);
    transition: transform .32s cubic-bezier(.65,0,.35,1);
    display:flex; flex-direction:column;
    overflow-y:auto;
  }
  .sidebar.open{ transform: translateX(0); }
  .sidebar-head{
    padding:26px 22px 14px; font-family:'Caveat', cursive; font-size:2.1rem; color:var(--orange);
  }
  .sidebar-section{ border-top:1px solid var(--border-soft); }
  .sidebar-section-btn{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:16px 22px; font-size:.95rem; font-weight:700; letter-spacing:.02em;
    display:flex; align-items:center; justify-content:space-between;
  }
  .sidebar-section-btn .ic{ color:var(--orange); font-size:1.1rem; }
  .sidebar-section-btn:hover{ background:var(--bg-elevated); }
  .sidebar-section-body{
    max-height:0; overflow:hidden; transition: max-height .3s ease;
    padding:0 22px;
  }
  .sidebar-section.open .sidebar-section-body{ max-height:520px; padding-bottom:16px; overflow-y:auto;}
  .recent-item, .private-item{
    display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:10px;
    font-size:.85rem; color:var(--text-dim); cursor:pointer;
  }
  .recent-item:hover, .private-item:hover{ background:var(--bg-elevated); color:var(--text); }
  .empty-hint{ color:var(--text-faint); font-size:.82rem; padding:8px; }

  /* ---------- Overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter: blur(2px);
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:45;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  /* ---------- Hero ---------- */
  .hero{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; position:relative; padding:40px 20px;
  }
  .hero-title{
    font-family:'Caveat', cursive; font-weight:700; color:var(--orange);
    font-size: clamp(3.2rem, 11vw, 7rem); margin: 6px 0 0; line-height:1;
    text-shadow: 0 0 40px var(--orange-glow);
  }
  .hero-sub{ color:var(--text-dim); margin-top:14px; font-size:1rem; max-width:420px; }
  .scroll-cue{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    color:var(--text-faint); font-size:.78rem; letter-spacing:.16em; text-transform:uppercase;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .scroll-cue .arrow{ width:10px; height:10px; border-right:2px solid var(--orange); border-bottom:2px solid var(--orange); transform:rotate(45deg); animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:rotate(45deg) translate(0,0);} 50%{ transform:rotate(45deg) translate(4px,4px);} }

  /* ---------- Picker (parallax cards) ---------- */
  .picker-section{
    min-height:100vh; padding: 14vh 6vw 16vh; display:flex; flex-direction:column; gap:60px; align-items:center;
  }
  .picker-eyebrow{ color:var(--text-faint); font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; }
  .picker-cards{ display:grid; grid-template-columns:repeat(3,minmax(200px,260px)); gap:26px; }
  @media (max-width:820px){ .picker-cards{ grid-template-columns:1fr; } }
  .picker-card{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:30px 24px; display:flex; flex-direction:column; gap:14px; align-items:flex-start;
    opacity:0; transform: translateY(60px); transition: opacity .7s ease, transform .7s ease, border-color .2s;
    box-shadow: var(--shadow);
  }
  .picker-card.in-view{ opacity:1; transform:translateY(0); }
  .picker-card:hover{ border-color: var(--card-accent); }
  .picker-card .emoji{ font-size:2.1rem; }
  .picker-card h3{ margin:0; font-size:1.25rem; }
  .picker-card p{ margin:0; color:var(--text-dim); font-size:.88rem; line-height:1.5; }
  .picker-card .go{ margin-top:auto; font-size:.82rem; font-weight:700; color: var(--card-accent); }
  .picker-card.lista{ --card-accent: var(--orange); }
  .picker-card.tabela{ --card-accent: var(--green); }
  .picker-card.nota{ --card-accent: var(--blue); }

  /* ---------- Workspace ---------- */
  .workspace{ min-height:60vh; padding: 6vh 6vw 20vh; }
  .workspace-title{ font-size:1.3rem; margin:0 0 22px; color:var(--text); }
  .workspace-empty{ color:var(--text-faint); font-size:.92rem; }
  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }
  .item-card{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:18px; cursor:pointer; transition:border-color .2s, transform .2s;
    display:flex; flex-direction:column; gap:8px;
  }
  .item-card:hover{ border-color:var(--orange); transform:translateY(-2px); }
  .item-card-top{ display:flex; align-items:center; justify-content:space-between; }
  .item-card-name{ font-weight:700; font-size:1rem; display:flex; align-items:center; gap:8px; }
  .item-tag{ font-size:.7rem; padding:3px 9px; border-radius:20px; font-weight:700; letter-spacing:.03em; }
  .item-tag.lista{ background:rgba(255,122,26,.15); color:var(--orange); }
  .item-tag.tabela{ background:rgba(62,207,110,.15); color:var(--green); }
  .item-tag.nota{ background:rgba(155,214,239,.15); color:var(--blue); }
  .item-card-meta{ color:var(--text-faint); font-size:.78rem; }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:26px; bottom:26px; width:60px; height:60px; border-radius:50%;
    background: var(--orange); border:none; color:#1a0e00; font-size:2rem; font-weight:600;
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px var(--orange-glow);
    z-index:41; transition: transform .2s, box-shadow .2s;
    line-height:0;
  }
  .fab:hover{ transform: scale(1.06) rotate(90deg); box-shadow:0 14px 34px var(--orange-glow); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,7,6,.68); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:60;
    opacity:0; pointer-events:none; transition:opacity .22s;
    padding:20px;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    background: var(--bg-soft); border:1px solid var(--border); border-radius: var(--radius-lg);
    width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
    padding:28px; box-shadow: var(--shadow);
    transform: translateY(16px) scale(.98); transition: transform .22s;
  }
  .modal-overlay.show .modal{ transform: translateY(0) scale(1); }
  .modal.wide{ max-width:820px; }
  .modal-title{ margin:0 0 4px; font-size:1.3rem; }
  .modal-sub{ margin:0 0 22px; color:var(--text-dim); font-size:.86rem; }
  .modal-close{
    position:absolute; top:20px; right:20px; background:none; border:none; color:var(--text-faint);
    font-size:1.3rem; line-height:1;
  }
  .modal-close:hover{ color:var(--text); }
  .modal{ position:relative; }

  .type-choice{ display:flex; gap:14px; flex-wrap:wrap; }
  .type-btn{
    flex:1; min-width:140px; background:var(--bg-elevated); border:1.5px solid var(--border);
    border-radius:var(--radius-md); padding:22px 14px; display:flex; flex-direction:column; align-items:center; gap:10px;
    color:var(--text); transition: border-color .18s, transform .18s;
  }
  .type-btn .emoji{ font-size:2rem; }
  .type-btn span.label{ font-weight:700; font-size:.95rem; }
  .type-btn:hover{ transform:translateY(-3px); }
  .type-btn.lista:hover{ border-color:var(--orange); }
  .type-btn.tabela:hover{ border-color:var(--green); }
  .type-btn.nota:hover{ border-color:var(--blue); }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:.82rem; color:var(--text-dim); margin-bottom:7px; font-weight:600; }
  .field input[type=text], .field input[type=password], .field select{
    width:100%; background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px;
    padding:11px 13px; color:var(--text); font-size:.95rem;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--orange); }

  .priority-row{ display:flex; gap:10px; }
  .priority-opt{
    flex:1; border:1.5px solid var(--border); border-radius:12px; padding:12px 8px; text-align:center;
    background:var(--bg-elevated); display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--text-dim);
  }
  .priority-opt input{ display:none; }
  .priority-opt .dot{ width:12px; height:12px; border-radius:50%; }
  .priority-opt.baixa .dot{ background:var(--green); }
  .priority-opt.media .dot{ background:var(--yellow); }
  .priority-opt.urgente .dot{ background:var(--red); }
  .priority-opt.selected{ color:var(--text); }
  .priority-opt.baixa.selected{ border-color:var(--green); }
  .priority-opt.media.selected{ border-color:var(--yellow); }
  .priority-opt.urgente.selected{ border-color:var(--red); }

  .type-toggle{ display:flex; gap:10px; }
  .type-toggle button{
    flex:1; padding:10px; border-radius:10px; border:1.5px solid var(--border); background:var(--bg-elevated); color:var(--text-dim);
  }
  .type-toggle button.selected{ border-color:var(--orange); color:var(--text); }

  .btn-primary{
    background:var(--orange); border:none; color:#1a0e00; font-weight:800; padding:12px 20px;
    border-radius:12px; font-size:.95rem; width:100%; margin-top:6px;
  }
  .btn-primary:hover{ background:var(--orange-dim); }
  .btn-secondary{
    background:none; border:1px solid var(--border); color:var(--text-dim); padding:10px 16px; border-radius:10px; font-size:.85rem;
  }
  .btn-secondary:hover{ color:var(--text); border-color:var(--text-dim); }

  /* ---------- List viewer ---------- */
  .task-row{ display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border-soft); }
  .task-row input[type=checkbox]{ width:17px; height:17px; accent-color:var(--orange); }
  .task-row span{ flex:1; }
  .task-row.done span{ text-decoration:line-through; color:var(--text-faint); }
  .task-row .del{ background:none; border:none; color:var(--text-faint); font-size:1rem; }
  .task-row .del:hover{ color:var(--red); }
  .add-task-row{ display:flex; gap:8px; margin-top:14px; }
  .add-task-row input{ flex:1; }

  /* ---------- Table editor ---------- */
  .sheet-tabs{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  .sheet-tab{ padding:7px 14px; border-radius:8px 8px 0 0; background:var(--bg-elevated); border:1px solid var(--border); border-bottom:none; font-size:.82rem; color:var(--text-dim); }
  .sheet-tab.active{ color:var(--text); border-color:var(--green); }
  .sheet-tab-add{ padding:7px 12px; border-radius:8px; background:none; border:1px dashed var(--border); color:var(--green); font-size:.85rem; }
  .table-toolbar{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .table-toolbar button{ background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:7px 12px; font-size:.82rem; }
  .table-toolbar button:hover{ color:var(--text); border-color:var(--green); }
  .table-wrap{ overflow:auto; border:1px solid var(--border); border-radius:10px; }
  .grid-table{ border-collapse:collapse; font-family:'JetBrains Mono', monospace; font-size:.85rem; }
  .grid-table td{ border:1px solid var(--border-soft); padding:0; position:relative; background:var(--bg-elevated); }
  .grid-table td .cell{ padding:7px 9px; outline:none; min-width:40px; height:100%; color:var(--text); }
  .grid-table td .cell:focus{ background:#26241f; }
  .col-resizer{ position:absolute; top:0; right:0; width:6px; height:100%; cursor:col-resize; }
  .col-resizer:hover{ background:var(--green); opacity:.4; }
  .row-resizer{ position:absolute; left:0; bottom:0; width:100%; height:5px; cursor:row-resize; }
  .row-resizer:hover{ background:var(--green); opacity:.4; }

  /* ---------- Note editor ---------- */
  .note-toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; padding:8px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px; }
  .note-toolbar select{ background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:6px 8px; font-size:.8rem; }
  .note-toolbar button{ background:var(--bg); border:1px solid var(--border); color:var(--text-dim); border-radius:7px; padding:6px 10px; font-size:.85rem; min-width:34px; }
  .note-toolbar button:hover{ color:var(--text); border-color:var(--blue); }
  .note-body{
    min-height:260px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px; padding:16px;
    outline:none; line-height:1.6; font-size:.98rem;
  }
  .note-body img{ max-width:100%; border-radius:8px; margin:8px 0; }
  .note-body ul li{ margin:4px 0; }

  /* ---------- Calendar ---------- */
  .calendar-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .calendar-header button{ background:var(--bg-elevated); border:1px solid var(--border); color:var(--orange); border-radius:8px; width:28px; height:28px; }
  .calendar-title{ font-weight:700; font-size:.9rem; }
  .calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; font-size:.75rem; text-align:center; }
  .calendar-grid .dow{ color:var(--text-faint); padding:4px 0; }
  .calendar-grid .day{ padding:7px 0; border-radius:7px; color:var(--text-dim); }
  .calendar-grid .day.today{ background:var(--orange); color:#1a0e00; font-weight:800; }
  .calendar-grid .day.blank{ visibility:hidden; }

  /* ---------- Calculator ---------- */
  .calc-display{ background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:1.4rem; margin-bottom:10px; word-break:break-all; }
  .calc-buttons{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
  .calc-buttons button{ background:var(--bg-elevated); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:12px 0; font-size:.95rem; font-family:'JetBrains Mono',monospace; }
  .calc-buttons button:hover{ border-color:var(--orange); }
  .calc-buttons button.op{ color:var(--orange); }
  .calc-buttons button.eq{ background:var(--orange); color:#1a0e00; font-weight:800; }
  .calc-history{ margin-top:12px; max-height:110px; overflow-y:auto; font-size:.78rem; color:var(--text-faint); }
  .calc-history div{ padding:3px 0; border-bottom:1px solid var(--border-soft); }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--bg-elevated); border:1px solid var(--orange); color:var(--text);
    padding:11px 20px; border-radius:12px; font-size:.85rem; z-index:80; opacity:0; transition:.25s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .login-status{ font-size:.8rem; color:var(--text-dim); padding:8px 0 2px; }
</style>
</head>
<body>

<div class="topbar">
  <button class="menu-btn" id="menuBtn"><span></span><span></span></button>
</div>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">MyList</div>

  <div class="sidebar-section" data-sec="recentes">
    <button class="sidebar-section-btn">Recentes <span class="ic">▾</span></button>
    <div class="sidebar-section-body" id="recentesBody"></div>
  </div>

  <div class="sidebar-section" data-sec="privado">
    <button class="sidebar-section-btn">Privado <span class="ic">▾</span></button>
    <div class="sidebar-section-body" id="privadoBody"></div>
  </div>

  <div class="sidebar-section" data-sec="calendario">
    <button class="sidebar-section-btn">Calendário <span class="ic">▾</span></button>
    <div class="sidebar-section-body" id="calendarioBody">
      <div class="calendar-header">
        <button id="calPrev">‹</button>
        <div class="calendar-title" id="calTitle"></div>
        <button id="calNext">›</button>
      </div>
      <div class="calendar-grid" id="calGrid"></div>
    </div>
  </div>

  <div class="sidebar-section" data-sec="calculadora">
    <button class="sidebar-section-btn">Calculadora <span class="ic">▾</span></button>
    <div class="sidebar-section-body" id="calculadoraBody">
      <div class="calc-display" id="calcDisplay">0</div>
      <div class="calc-buttons" id="calcButtons"></div>
      <div class="calc-history" id="calcHistory"></div>
    </div>
  </div>

  <div class="sidebar-section" data-sec="usuario">
    <button class="sidebar-section-btn">Criar usuário <span class="ic">▾</span></button>
    <div class="sidebar-section-body" id="usuarioBody"></div>
  </div>
</aside>

<main>
  <section class="hero">
    <div class="hero-title">MyList</div>
    <p class="hero-sub">Suas listas, tabelas e anotações, num só lugar.</p>
    <div class="scroll-cue"><span>deslize</span><span class="arrow"></span></div>
  </section>

  <section class="picker-section">
    <div class="picker-eyebrow">o que você quer criar?</div>
    <div class="picker-cards">
      <button class="picker-card lista" data-type="lista">
        <span class="emoji">📋</span>
        <h3>Lista</h3>
        <p>Tarefas com prioridade e uma carinha pra cada nível de urgência.</p>
        <span class="go">criar lista →</span>
      </button>
      <button class="picker-card tabela" data-type="tabela">
        <span class="emoji">📊</span>
        <h3>Tabela</h3>
        <p>Linhas e colunas editáveis, redimensione do seu jeito.</p>
        <span class="go">criar tabela →</span>
      </button>
      <button class="picker-card nota" data-type="nota">
        <span class="emoji">📝</span>
        <h3>Anotação</h3>
        <p>Texto livre, formatado, público ou trancado com senha.</p>
        <span class="go">criar anotação →</span>
      </button>
    </div>
  </section>

  <section class="workspace">
    <h2 class="workspace-title">Seus itens</h2>
    <div class="workspace-empty" id="workspaceEmpty">Nada por aqui ainda — toque no + para criar sua primeira lista, tabela ou anotação.</div>
    <div class="item-grid" id="itemGrid"></div>
  </section>
</main>

<button class="fab" id="fabBtn">+</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ============ STATE ============ */
  let items = [];        // {id,type,name,createdAt,...}
  let user = null;        // {name,password,lastLogin}
  let calcHistory = [];
  let calcExpr = "0";
  let calToday = new Date();
  let calView = { y: calToday.getFullYear(), m: calToday.getMonth() };

  const $ = (sel, el) => (el||document).querySelector(sel);
  const $all = (sel, el) => Array.from((el||document).querySelectorAll(sel));
  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
  }

  /* ============ STORAGE ============ */
  async function loadAll(){
    try{ const r = await window.storage.get('items', false); items = r ? JSON.parse(r.value) : []; }
    catch(e){ items = []; }
    try{ const r = await window.storage.get('user', false); user = r ? JSON.parse(r.value) : null; }
    catch(e){ user = null; }
    try{ const r = await window.storage.get('calc-history', false); calcHistory = r ? JSON.parse(r.value) : []; }
    catch(e){ calcHistory = []; }
  }
  async function saveItems(){
    try{ await window.storage.set('items', JSON.stringify(items), false); }
    catch(e){ console.error('erro ao salvar itens', e); toast('Não consegui salvar agora.'); }
  }
  async function saveUser(){
    try{ await window.storage.set('user', JSON.stringify(user), false); }
    catch(e){ console.error('erro ao salvar usuário', e); }
  }
  async function saveCalcHistory(){
    try{ await window.storage.set('calc-history', JSON.stringify(calcHistory), false); }
    catch(e){ console.error('erro ao salvar histórico', e); }
  }

  /* ============ SIDEBAR ============ */
  const menuBtn = $('#menuBtn'), sidebar = $('#sidebar'), overlay = $('#overlay');
  function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); menuBtn.classList.add('active'); }
  function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); menuBtn.classList.remove('active'); }
  menuBtn.addEventListener('click', ()=> sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
  overlay.addEventListener('click', ()=>{ closeSidebar(); closeModal(); });

  $all('.sidebar-section-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sec = btn.parentElement;
      const wasOpen = sec.classList.contains('open');
      $all('.sidebar-section').forEach(s=>s.classList.remove('open'));
      if(!wasOpen) sec.classList.add('open');
    });

  function renderRecentes(){
    const body = $('#recentesBody');
    const sorted = [...items].sort((a,b)=> b.createdAt - a.createdAt);
    if(sorted.length===0){ body.innerHTML = '<div class="empty-hint">Nada criado ainda.</div>'; return; }
    body.innerHTML = sorted.map(it=>{
      const ic = it.type==='lista' ? '📋' : it.type==='tabela' ? '📊' : '📝';
      return `<div class="recent-item" data-open="${it.id}">${ic} ${escapeHtml(it.name)}</div>`;
    }).join('');
    $all('[data-open]', body).forEach(el=>{
      el.addEventListener('click', ()=>{ closeSidebar(); openItem(el.dataset.open); });
    });

  function renderPrivado(){
    const body = $('#privadoBody');
    const priv = items.filter(it=> it.type==='nota' && it.note.isPrivate);
    if(priv.length===0){ body.innerHTML = '<div class="empty-hint">Nenhuma anotação privada.</div>'; return; }
    body.innerHTML = priv.map(it=> `<div class="private-item" data-open="${it.id}">🔒 ${escapeHtml(it.name)}</div>`).join('');
    $all('[data-open]', body).forEach(el=>{
      el.addEventListener('click', ()=>{ closeSidebar(); openItem(el.dataset.open); });

  function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s; return d.innerHTML; }

  /* ============ CALENDÁRIO ============ */
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  function renderCalendar(){
    $('#calTitle').textContent = MESES[calView.m] + ' ' + calView.y;
    const first = new Date(calView.y, calView.m, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(calView.y, calView.m+1, 0).getDate();
    let html = ['D','S','T','Q','Q','S','S'].map(d=>`<div class="dow">${d}</div>`).join('');
    for(let i=0;i<startDow;i++) html += '<div class="day blank"></div>';
    const isCurrentMonth = calToday.getFullYear()===calView.y && calToday.getMonth()===calView.m;
    for(let d=1; d<=daysInMonth; d++){
      const isToday = isCurrentMonth && d===calToday.getDate();
      html += `<div class="day${isToday?' today':''}">${d}</div>`;
    }
    $('#calGrid').innerHTML = html;
  }
  $('#calPrev').addEventListener('click', ()=>{ calView.m--; if(calView.m<0){calView.m=11; calView.y--;} renderCalendar(); });
  $('#calNext').addEventListener('click', ()=>{ calView.m++; if(calView.m>11){calView.m=0; calView.y++;} renderCalendar(); });

  /* ============ CALCULADORA ============ */
  const CALC_KEYS = ['C','(',')','⌫','7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+'];
  function renderCalcButtons(){
    $('#calcButtons').innerHTML = CALC_KEYS.map(k=>{
      const cls = (k==='=') ? 'eq' : (['+','-','*','/'].includes(k) ? 'op' : '');
      return `<button class="${cls}" data-k="${k}">${k}</button>`;
    }).join('');
    $all('#calcButtons button').forEach(b=> b.addEventListener('click', ()=> calcPress(b.dataset.k)));
  }
  function calcPress(k){
    if(k==='C'){ calcExpr = '0'; }
    else if(k==='⌫'){ calcExpr = calcExpr.length>1 ? calcExpr.slice(0,-1) : '0'; }
    else if(k==='='){
      try{
        const safe = calcExpr.replace(/[^0-9+\-*/().]/g,'');
        // eslint-disable-next-line no-new-func
        const result = Function('"use strict";return (' + safe + ')')();
        calcHistory.unshift(calcExpr + ' = ' + result);
        calcHistory = calcHistory.slice(0,30);
        saveCalcHistory();
        renderCalcHistory();
        calcExpr = String(result);
      }catch(e){ calcExpr = 'Erro'; }
    } else {
      calcExpr = (calcExpr==='0' && !isNaN(k)) ? k : calcExpr + k;
    }
    $('#calcDisplay').textContent = calcExpr;
  }
  function renderCalcHistory(){
    $('#calcHistory').innerHTML = calcHistory.map(h=>`<div>${escapeHtml(h)}</div>`).join('') || '<div class="empty-hint">Sem cálculos salvos.</div>';
  }

  /* ============ USUÁRIO ============ */
  function renderUsuario(){
    const body = $('#usuarioBody');
    if(user){
      const hrsSinceLogin = (Date.now() - user.lastLogin) / 36e5;
      body.innerHTML = `
        <div class="login-status">Logado como <strong>${escapeHtml(user.name)}</strong></div>
        <button class="btn-secondary" id="logoutBtn" style="margin-top:8px;width:100%;">Sair</button>
      `;
      $('#logoutBtn').addEventListener('click', ()=>{ user.loggedIn=false; saveUser(); renderUsuario(); toast('Sessão encerrada.'); });
      if(!user.loggedIn || hrsSinceLogin>24){
        body.innerHTML += renderLoginForm(true);
        bindLoginForm();
      }
    } else {
      body.innerHTML = renderLoginForm(false);
      bindLoginForm();
    }
  }
  function renderLoginForm(isRelogin){
    return `
      <div class="field" style="margin-top:12px;">
        <label>${isRelogin ? 'Confirme sua senha para continuar' : 'Nome de usuário'}</label>
        ${isRelogin ? '' : '<input type="text" id="userNameInput" placeholder="seu nome">'}
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="userPassInput" placeholder="senha">
      </div>
      <button class="btn-primary" id="userSubmitBtn">${isRelogin ? 'Entrar novamente' : 'Criar usuário'}</button>
    `;
  }
  function bindLoginForm(){
    const btn = $('#userSubmitBtn');
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      const pass = $('#userPassInput').value.trim();
      if(!user){
        const name = $('#userNameInput').value.trim();
        if(!name || !pass){ toast('Preencha nome e senha.'); return; }
        user = { name, password: pass, lastLogin: Date.now(), loggedIn: true };
        saveUser(); toast('Usuário criado!');
      } else {
        if(pass !== user.password){ toast('Senha incorreta.'); return; }
        user.lastLogin = Date.now(); user.loggedIn = true;
        saveUser(); toast('Bem-vindo(a) de volta!');
      }
      renderUsuario();
    });
  }

  /* ============ WORKSPACE / ITEM CARDS ============ */
  const FACES = { baixa:'🙂', media:'😟', urgente:'😠' };
  function renderItemGrid(){
    const grid = $('#itemGrid'), empty = $('#workspaceEmpty');
    if(items.length===0){ grid.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';
    const sorted = [...items].sort((a,b)=> b.createdAt - a.createdAt);
    grid.innerHTML = sorted.map(it=>{
      const tagLabel = it.type==='lista'?'Lista':it.type==='tabela'?'Tabela':'Anotação';
      let meta = '';
      if(it.type==='lista') meta = (it.tasks||[]).length + ' tarefa(s) · ' + FACES[it.priority] + ' ' + it.priority;
      if(it.type==='tabela') meta = (it.sheets||[]).length + ' aba(s)';
      if(it.type==='nota') meta = it.note.isPrivate ? '🔒 privada' : 'pública';
      const face = it.type==='lista' ? `<span>${FACES[it.priority]}</span>` : '';
      return `
        <div class="item-card" data-open="${it.id}">
          <div class="item-card-top">
            <span class="item-tag ${it.type}">${tagLabel}</span>
          </div>
          <div class="item-card-name">${escapeHtml(it.name)} ${face}</div>
          <div class="item-card-meta">${meta}</div>
        </div>`;
    }).join('');
    $all('[data-open]', grid).forEach(el=> el.addEventListener('click', ()=> openItem(el.dataset.open)));
  }

  function findItem(id){ return items.find(i=>i.id===id); }
  function openItem(id){
    const it = findItem(id);
    if(!it) return;
    if(it.type==='lista') openListViewer(it);
    else if(it.type==='tabela') openTableViewer(it);
    else if(it.type==='nota') openNoteViewer(it);
  }

  function refreshAll(){ renderRecentes(); renderPrivado(); renderItemGrid(); }

  /* ============ MODAL PLUMBING ============ */
  const modalOverlay = $('#modalOverlay'), modalEl = $('#modal');
  function openModal(html, wide){
    modalEl.className = 'modal' + (wide?' wide':'');
    modalEl.innerHTML = '<button class="modal-close" id="modalCloseBtn">✕</button>' + html;
    modalOverlay.classList.add('show');
    $('#modalCloseBtn').addEventListener('click', closeModal);
  }
  function closeModal(){ modalOverlay.classList.remove('show'); modalEl.innerHTML=''; }
  modalOverlay.addEventListener('click', (e)=>{ if(e.target===modalOverlay) closeModal(); });

  /* ============ CREATE FLOW ============ */
  $('#fabBtn').addEventListener('click', ()=> openTypeChoice());
  $all('.picker-card').forEach(card=> card.addEventListener('click', ()=> openCreateForm(card.dataset.type)));

  function openTypeChoice(){
    openModal(`
      <h3 class="modal-title">O que você quer criar?</h3>
      <p class="modal-sub">Escolha um tipo pra começar.</p>
      <div class="type-choice">
        <button class="type-btn lista" data-type="lista"><span class="emoji">📋</span><span class="label">Lista</span></button>
        <button class="type-btn tabela" data-type="tabela"><span class="emoji">📊</span><span class="label">Tabela</span></button>
        <button class="type-btn nota" data-type="nota"><span class="emoji">📝</span><span class="label">Anotação</span></button>
      </div>
    `);
    $all('.type-btn').forEach(b=> b.addEventListener('click', ()=> openCreateForm(b.dataset.type)));
  }

  function openCreateForm(type){
    if(type==='lista') openListForm();
    else if(type==='tabela') openTableForm();
    else if(type==='nota') openNoteForm();
  }

  /* ----- LISTA ----- */
  function openListForm(){
    openModal(`
      <h3 class="modal-title">Nova lista</h3>
      <div class="field">
        <label>Nome da lista</label>
        <input type="text" id="listName" placeholder="ex: Compras da semana">
      </div>
      <div class="field">
        <label>Prioridade</label>
        <div class="priority-row">
          <label class="priority-opt baixa selected"><input type="radio" name="prio" value="baixa" checked><span class="dot"></span>Baixa 🙂</label>
          <label class="priority-opt media"><input type="radio" name="prio" value="media"><span class="dot"></span>Média 😟</label>
          <label class="priority-opt urgente"><input type="radio" name="prio" value="urgente"><span class="dot"></span>Urgente 😠</label>
        </div>
      </div>
      <button class="btn-primary" id="createListBtn">Criar lista</button>
    `);
    $all('.priority-opt').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        $all('.priority-opt').forEach(o=>o.classList.remove('selected'));
        opt.classList.add('selected');
        $('input', opt).checked = true;
      });
    });
    $('#createListBtn').addEventListener('click', ()=>{
      const name = $('#listName').value.trim();
      if(!name){ toast('Dê um nome pra sua lista.'); return; }
      const prio = $('input[name=prio]:checked').value;
      const it = { id: uid(), type:'lista', name, priority: prio, tasks: [], createdAt: Date.now() };
      items.push(it); saveItems(); refreshAll(); closeModal();
      openListViewer(it);
    });
  }

  function openListViewer(it){
    openModal(`
      <h3 class="modal-title">${escapeHtml(it.name)} ${FACES[it.priority]}</h3>
      <p class="modal-sub">Prioridade: ${it.priority}</p>
      <div id="taskList"></div>
      <div class="add-task-row">
        <input type="text" id="newTaskInput" placeholder="Adicionar tarefa...">
        <button class="btn-secondary" id="addTaskBtn">Add</button>
      </div>
    `);
    function renderTasks(){
      $('#taskList').innerHTML = it.tasks.map((t,i)=>`
        <div class="task-row ${t.done?'done':''}">
          <input type="checkbox" data-i="${i}" ${t.done?'checked':''}>
          <span>${escapeHtml(t.text)}</span>
          <button class="del" data-del="${i}">✕</button>
        </div>`).join('') || '<div class="empty-hint">Nenhuma tarefa ainda.</div>';
      $all('[data-i]').forEach(cb=> cb.addEventListener('change', ()=>{
        it.tasks[cb.dataset.i].done = cb.checked; saveItems(); renderTasks(); renderItemGrid();
      }));
      $all('[data-del]').forEach(b=> b.addEventListener('click', ()=>{
        it.tasks.splice(b.dataset.del,1); saveItems(); renderTasks(); renderItemGrid();
      }));
    }
    renderTasks();
    $('#addTaskBtn').addEventListener('click', addTask);
    $('#newTaskInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') addTask(); });
    function addTask(){
      const val = $('#newTaskInput').value.trim();
      if(!val) return;
      it.tasks.push({ text: val, done:false });
      $('#newTaskInput').value='';
      saveItems(); renderTasks(); renderItemGrid();
    }
  }

  /* ----- TABELA ----- */
  function blankSheet(rows, cols){
    return {
      rows, cols,
      cells: Array.from({length:rows},()=>Array.from({length:cols},()=>'')),
      colWidths: Array(cols).fill(96),
      rowHeights: Array(rows).fill(34)
    };
  }
  function openTableForm(){
    openModal(`
      <h3 class="modal-title">Nova tabela</h3>
      <div class="field">
        <label>Nome da tabela</label>
        <input type="text" id="tableName" placeholder="ex: Orçamento mensal">
      </div>
      <button class="btn-primary" id="createTableBtn">Criar tabela</button>
    `);
    $('#createTableBtn').addEventListener('click', ()=>{
      const name = $('#tableName').value.trim();
      if(!name){ toast('Dê um nome pra sua tabela.'); return; }
      const it = { id: uid(), type:'tabela', name, sheets:[blankSheet(5,5)], activeSheet:0, createdAt: Date.now() };
      items.push(it); saveItems(); refreshAll(); closeModal();
      openTableViewer(it);
    });
  }

  function openTableViewer(it){
    openModal(`
      <h3 class="modal-title">${escapeHtml(it.name)}</h3>
      <div class="sheet-tabs" id="sheetTabs"></div>
      <div class="table-toolbar">
        <button id="addRowBtn">+ linha</button>
        <button id="addColBtn">+ coluna</button>
        <button id="addSheetBtn">＋ aba (duplicar molde)</button>
      </div>
      <div class="table-wrap" id="tableWrap"></div>
    `, true);

    function renderTabs(){
      $('#sheetTabs').innerHTML = it.sheets.map((s,i)=>
        `<div class="sheet-tab ${i===it.activeSheet?'active':''}" data-tab="${i}">Aba ${i+1}</div>`
      ).join('') + `<button class="sheet-tab-add" id="quickAddSheet">＋</button>`;
      $all('[data-tab]').forEach(t=> t.addEventListener('click', ()=>{ it.activeSheet = +t.dataset.tab; saveItems(); renderTabs(); renderGrid(); }));
      $('#quickAddSheet').addEventListener('click', duplicateSheet);
    }

    function renderGrid(){
      const sheet = it.sheets[it.activeSheet];
      let html = `<table class="grid-table" style="table-layout:fixed;">`;
      for(let r=0;r<sheet.rows;r++){
        html += `<tr style="height:${sheet.rowHeights[r]}px;">`;
        for(let c=0;c<sheet.cols;c++){
          html += `<td style="width:${sheet.colWidths[c]}px;">
            <div class="cell" contenteditable="true" data-r="${r}" data-c="${c}">${escapeHtml(sheet.cells[r][c]||'')}</div>
            ${r===0?`<div class="col-resizer" data-col="${c}"></div>`:''}
            ${c===sheet.cols-1?`<div class="row-resizer" data-row="${r}"></div>`:''}
          </td>`;
        }
        html += `</tr>`;
      }
      html += `</table>`;
      $('#tableWrap').innerHTML = html;

      $all('.cell', $('#tableWrap')).forEach(cell=>{
        cell.addEventListener('input', ()=>{
          sheet.cells[cell.dataset.r][cell.dataset.c] = cell.textContent;
          saveItems();
        });
      });
      $all('.col-resizer', $('#tableWrap')).forEach(handle=>{
        handle.addEventListener('mousedown', (e)=>{
          e.preventDefault();
          const col = +handle.dataset.col;
          const startX = e.clientX; const startW = sheet.colWidths[col];
          function move(ev){
            const w = Math.max(40, startW + (ev.clientX - startX));
            sheet.colWidths[col] = w; renderGrid();
          }
          function up(){ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); saveItems(); }
          document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
        });
      });
      $all('.row-resizer', $('#tableWrap')).forEach(handle=>{
        handle.addEventListener('mousedown', (e)=>{
          e.preventDefault();
          const row = +handle.dataset.row;
          const startY = e.clientY; const startH = sheet.rowHeights[row];
          function move(ev){
            const h = Math.max(24, startH + (ev.clientY - startY));
            sheet.rowHeights[row] = h; renderGrid();
          }
          function up(){ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); saveItems(); }
          document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
        });
      });
    }

    function duplicateSheet(){
      const cur = it.sheets[it.activeSheet];
      const fresh = blankSheet(cur.rows, cur.cols);
      fresh.colWidths = [...cur.colWidths]; fresh.rowHeights = [...cur.rowHeights];
      it.sheets.push(fresh); it.activeSheet = it.sheets.length-1;
      saveItems(); refreshAll(); renderTabs(); renderGrid();
      toast('Nova aba criada com o mesmo molde.');
    }

    $('#addRowBtn').addEventListener('click', ()=>{
      const sheet = it.sheets[it.activeSheet];
      sheet.cells.push(Array(sheet.cols).fill(''));
      sheet.rowHeights.push(34); sheet.rows++;
      saveItems(); renderGrid();
    });
    $('#addColBtn').addEventListener('click', ()=>{
      const sheet = it.sheets[it.activeSheet];
      sheet.cells.forEach(row=> row.push(''));
      sheet.colWidths.push(96); sheet.cols++;
      saveItems(); renderGrid();
    });
    $('#addSheetBtn').addEventListener('click', duplicateSheet);

    renderTabs(); renderGrid();
  }

        note: { isPrivate: vis==='privado', password: pass, content: '', unlocked: vis!=='privado' } };
      items.push(it); saveItems(); refreshAll(); closeModal();
      openNoteViewer(it);

  function openNoteViewer(it){

      openModal(`

        <button class="btn-primary" id="unlockBtn">Desbloquear</button>

    openModal(`

        <select id="fontFamily">
          <option value="Manrope">Manrope</option>

        </select>

        <button data-list="bolinha" title="Lista com bolinha">•</button>
        <button data-list="numero" title="Lista numerada">1.</button>
        <button data-list="caixa" title="Lista com caixa de seleção">☐</button>
        <button data-list="risco" title="Risco (concluído)">S̶</button>
        <button id="insertImgBtn" title="Inserir foto">🖼</button>
        <input type="file" id="imgInput" accept="image/*" style="display:none;">
      </div>
      <div class="note-body" id="noteBody" contenteditable="true">${it.note.content}</div>
      <button class="btn-primary" id="saveNoteBtn" style="margin-top:14px;">Salvar anotação</button>
    `, true);

    const body = $('#noteBody');
    $('#fontFamily').addEventListener('change', (e)=> document.execCommand('fontName', false, e.target.value));
    $('#fontSize').addEventListener('change', (e)=> document.execCommand('fontSize', false, e.target.value));
    $all('[data-cmd]').forEach(b=> b.addEventListener('click', ()=> document.execCommand(b.dataset.cmd, false, null)));
    $all('[data-list]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const type = b.dataset.list;
        if(type==='bolinha') document.execCommand('insertUnorderedList', false, null);
        else if(type==='numero') document.execCommand('insertOrderedList', false, null);
        else if(type==='risco') document.execCommand('strikeThrough', false, null);
        else if(type==='caixa') document.execCommand('insertHTML', false, '<label style="display:flex;gap:6px;align-items:center;"><input type="checkbox"> item</label><br>');
        body.focus();
      });
    });
    $('#insertImgBtn').addEventListener('click', ()=> $('#imgInput').click());
    $('#imgInput').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=> { document.execCommand('insertImage', false, reader.result); };
      reader.readAsDataURL(file);
    });
    $('#saveNoteBtn').addEventListener('click', ()=>{
      it.note.content = body.innerHTML;
      saveItems(); refreshAll();
      toast('Anotação salva.');
    });
  }

  /* ============ SCROLL PARALLAX ============ */
  const hero = $('.hero');
  function onScroll(){
    const y = window.scrollY;
    hero.style.transform = `translateY(${y*0.25}px)`;
    hero.style.opacity = Math.max(0, 1 - y/420);
    $all('.picker-card').forEach((card,i)=>{
      const rect = card.getBoundingClientRect();
      if(rect.top < window.innerHeight*0.85) card.classList.add('in-view');
    });
  }
  window.addEventListener('scroll', onScroll, { passive:true });

  /* ============ INIT ============ */
  async function init(){
    await loadAll();
    renderCalcButtons();
    renderCalcHistory();
    renderCalendar();
    renderUsuario();
    refreshAll();
    onScroll();
  }
  init();
})();
</script>
</body>
</html>
